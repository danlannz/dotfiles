# VM-only migration pilot. This is deliberately not a global configuration.
min_version = "2026.11.0"

[tools]
node = "26.13.0"
bun = "1.4.4"

[settings]
lockfile = true
locked = true
lockfile_platforms = ["macos-arm64"]

[settings.task]
run_auto_install = false

[tasks.verify]
description = "Run the existing regression suite and syntax/lint checks with pilot tools"
dir = "{{ config_root }}/../.."
run = [
  '''root=${DOTFILES_MISE_PILOT_ROOT:-}
[ -n "$root" ] &&
[ "$HOME" = "$root/home" ] &&
[ "${DOTFILES_MISE_PILOT_BIN:-}" = "$root/bin/mise" ] &&
[ "${MISE_CONFIG_DIR:-}" = "$root/config" ] &&
[ "${MISE_DATA_DIR:-}" = "$root/data" ] &&
[ "${MISE_CACHE_DIR:-}" = "$root/cache" ] &&
[ "${MISE_STATE_DIR:-}" = "$root/state" ] || {
  echo "This task requires the isolated VM pilot environment; see mise/pilot/README.md." >&2
  exit 1
}''',
  '"$DOTFILES_MISE_PILOT_BIN" -C "{{ config_root }}" install --locked',
  "bun test",
  'for file in bootstrap.sh script/setup-app-store; do bash -n "$file" || exit; done',
  'for file in script/after-setup script/setup .path .functions .alias; do sh -n "$file" || exit; done',
  "zsh -fn .zshrc",
  "ruby -c .Brewfile",
  "ruby -c Brewfile.app-store",
  "shellcheck --severity=error bootstrap.sh script/after-setup script/setup-app-store",
  "git diff --check",
]
