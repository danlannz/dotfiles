min_version = "2026.11.2"

# Lock only our defaults; projects retain their own version/locking policy.
[tool_config]
locked = true

[tools]
node = "26.13.0"
bun = "1.4.4"
java = "temurin-21.0.4+7.0.LTS"
kotlin = "1.9.25"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "macos-x64"]
idiomatic_version_file_enable_tools = ["node"]
# Python remains asdf-owned until an attested current release is adopted.
# Go/Rust/uv/CocoaPods remain Brew-owned.
enable_tools = ["node", "nodejs", "bun", "pnpm", "java", "kotlin"]
