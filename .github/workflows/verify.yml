name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      # Limit the action's trust default to the reviewed root file, not a directory.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/mise.toml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require the ARM64 runner matching the verified mise binary
        run: test "$(uname -m)" = arm64

      - name: Isolate verification tools from runner home configuration
        run: |
          {
            echo "MISE_CONFIG_DIR=$RUNNER_TEMP/dotfiles-ci/config"
            echo "MISE_DATA_DIR=$RUNNER_TEMP/dotfiles-ci/data"
            echo "MISE_CACHE_DIR=$RUNNER_TEMP/dotfiles-ci/cache"
            echo "MISE_STATE_DIR=$RUNNER_TEMP/dotfiles-ci/state"
          } >> "$GITHUB_ENV"

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.11.2"
          # Published digest of mise-v2026.11.2-macos-arm64, not its archive.
          sha256: "90684d13d9125cf207c45b19dbdbf19baf8d5d0e3e10109f236b1b4d027416c0"
          install: false
          cache: false
          env: false
          add_shims_to_path: false

      - name: Prepare verification dependencies in runner-temporary mise directories
        run: |
          mkdir -p "$MISE_CONFIG_DIR" "$MISE_DATA_DIR" "$MISE_CACHE_DIR" "$MISE_STATE_DIR"
          ln -s "$GITHUB_WORKSPACE/mise/config.toml" "$MISE_CONFIG_DIR/config.toml"
          ln -s "$GITHUB_WORKSPACE/mise/mise.lock" "$MISE_CONFIG_DIR/mise.lock"
          mise trust "$GITHUB_WORKSPACE/mise.toml"
          mise install --locked
          mise which node
          mise which bun
          command -v shellcheck >/dev/null || brew install shellcheck

      - name: Run host-safe tests and lint
        run: mise run verify
